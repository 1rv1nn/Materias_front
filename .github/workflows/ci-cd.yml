name: CI/CD Pipeline

# Trigger: ejecutar automáticamente en push a develop o Pull Request hacia develop
on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

# Concurrency to ensure only one workflow run per branch at a time.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Variables de entorno globales
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Job de test
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./blog-resenas-materias
    
    env:
      CI: true
    
    steps:
      # Configurar el entorno
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: ./blog-resenas-materias/package-lock.json
      
      # Limpiar cache de npm y instalar dependencias
      - name: Clean npm cache
        run: npm cache clean --force
      
      # Instalar dependencias
      - name: Install dependencies
        run: npm install
      
      # Ejecución de las pruebas unitarias
      - name: Run unit tests
        run: |
          npm test -- --coverage --watchAll=false --passWithNoTests
          # Ensure coverage directory exists
          mkdir -p coverage || true
      
      # Ejecución de pruebas de instalación (verificar que el build funciona)
      - name: Run build test
        run: npm run build
      
      # Run Trivy vulnerability scan
      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './blog-resenas-materias'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
      
      # Lista archivos de coverage para debug
      - name: List coverage files
        if: always()
        run: |
          echo "Listing coverage directory contents:"
          ls -la coverage/ || echo "No coverage directory found"
          find . -name "coverage" -type d || echo "No coverage directories found"
      
      # Opcional: subir resultados de coverage
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: blog-resenas-materias/coverage/
          if-no-files-found: warn

  # Push to ECR
  deploy-ecr:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::677841334273:role/ing-soft-2-github-actions-role
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, tag, and push frontend Docker image to ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPO_NAME }}
          IMAGE_TAG: frontend-${{ github.sha }}
        run: |
          docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG ./blog-resenas-materias
          docker tag $REGISTRY/$REPOSITORY:$IMAGE_TAG $REGISTRY/$REPOSITORY:frontend-latest
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG
          docker push $REGISTRY/$REPOSITORY:frontend-latest

  # Push to GHCR
  deploy-ghcr:
    name: Build and Push Docker Image to GHCR
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      # Autenticarse en el GitHub Container Registry
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      # Extraer metadatos para etiquetas e imágenes
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
      
      # Configurar Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      # Construir y publicar la imagen al GitHub Container Registry
      - name: Build and Push Docker image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: ./blog-resenas-materias
          file: ./blog-resenas-materias/dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploy to EC2
  deploy-ec2:
    needs: deploy-ecr
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::677841334273:role/ing-soft-2-github-actions-role
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Deploy to EC2
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPO_NAME }}
          IMAGE_TAG: frontend-${{ github.sha }}
          EC2_HOST: ${{ secrets.EC2_FRONT_HOST }}
          EC2_USER: ec2-user
          EC2_SSH_KEY: ${{ secrets.EC2_FRONT_SSH_KEY }}
        run: |
          # Save SSH key to file
          printf '%s\n' "$EC2_SSH_KEY" > private_key.pem
          chmod 600 private_key.pem
          
          # Connect to EC2 and deploy
          ssh -o StrictHostKeyChecking=no -i private_key.pem ${EC2_USER}@${EC2_HOST} << 'ENDSSH'
            # Login to ECR
            aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }}
            
            # Stop and remove existing container
            docker stop materias-front || true
            docker rm materias-front || true
            
            # Pull new image
            docker pull ${{ steps.login-ecr.outputs.registry }}/${{ env.REPOSITORY }}:${{ env.IMAGE_TAG }}
            
            # Run new container
            docker run -d \
              --name materias-front \
              --restart unless-stopped \
              -p 80:3000 \
              ${{ steps.login-ecr.outputs.registry }}/${{ env.REPOSITORY }}:${{ env.IMAGE_TAG }}
            
            # Clean up old images
            docker image prune -af
          ENDSSH
          
          # Clean up SSH key
          rm -f private_key.pem