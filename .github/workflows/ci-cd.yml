name: CI/CD Pipeline

# Trigger: ejecutar automáticamente en push a develop o Pull Request hacia develop
on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

# Variables de entorno globales
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Job de test
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./blog-resenas-materias
    
    env:
      CI: true
    
    steps:
      # Configurar el entorno
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      # Limpiar cache de npm y instalar dependencias
      - name: Clean npm cache
        run: npm cache clean --force
      
      # Instalar dependencias
      - name: Install dependencies
        run: npm install
      
      # Ejecución de las pruebas unitarias
      - name: Run unit tests
        run: |
          npm test -- --coverage --watchAll=false --passWithNoTests
      
      # Ejecución de pruebas de instalación (verificar que el build funciona)
      - name: Run build test
        run: npm run build
      
      # Opcional: subir resultados de coverage
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: warn

  # Job build-and-push: solo se ejecuta si el job de test fue exitoso
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      # Autenticarse en el GitHub Container Registry
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      # Extraer metadatos para etiquetas e imágenes
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
      
      # Configurar Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      # Construir la imagen de Docker a partir del Dockerfile
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./blog-resenas-materias
          file: ./blog-resenas-materias/dockerfile
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      # La imagen debe ser etiquetada de forma única con la versión de su aplicación
      # y publicar la imagen etiquetada al GitHub Container Registry
      - name: Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./blog-resenas-materias
          file: ./blog-resenas-materias/dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
