[unix_http_server]
file=/var/run/supervisor.sock
chmod=0777

[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
user=appuser

[inet_http_server]
port=9001
username=admin
password=admin

[program:pm2]
command=/app/start-pm2.sh
directory=/app
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/pm2-err.log
stdout_logfile=/var/log/supervisor/pm2-out.log
environment=HOME="/app",USER="appuser"
user=appuser

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock
username=appuser
password=appuser

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface