[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/app/supervisord.pid
user=appuser
silent=false
loglevel=info

[program:pm2]
command=/app/start-pm2.sh
directory=/app
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/pm2-err.log
stdout_logfile=/var/log/supervisor/pm2-out.log
environment=HOME="/app",USER="appuser"
user=appuser